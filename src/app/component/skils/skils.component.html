<div class="container">

    <div class="header">
        <section id="skills">
            <h2 class="gradient-text">Technical <span class="gradient">Skills</span></h2>
        </section>
        <p>
            Full JavaScript stack expertise across frontend, backend, mobile, and architecture —
            built through enterprise production work and freelance projects.
        </p>
    </div>

    <div class="skill-categories">
        <div class="skill-category" *ngFor="let cat of skillCategories">
            <h3 class="category-title">{{cat.title}}</h3>
            <div class="skill-chips">
                <div class="skill-chip" *ngFor="let skill of cat.skills" [matTooltip]="skill.name">
                    <img *ngIf="skill.icon" [src]="skill.icon" [alt]="skill.name" class="chip-icon" />
                    <span class="chip-name">{{skill.name}}</span>
                </div>
            </div>
        </div>
    </div>

</div>
