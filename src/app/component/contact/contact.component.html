<div class="container">
    <div class="header">
        <section id="contact">
            <h2 class="gradient-text">Get In <span class="gradient">Touch</span></h2>
        </section>
        <p>
            I'd love to hear from you! Reach out through any of the channels below.
        </p>
    </div>

    <div class="contact-grid">

        <a [href]="'mailto:' + userData.email" class="contact-card" title="Send Email">
            <div class="card-icon email-icon">
                <fa-icon [icon]="faEnvelope"></fa-icon>
            </div>
            <div class="card-info">
                <span class="card-label">Email</span>
                <span class="card-value">{{userData.email}}</span>
            </div>
            <fa-icon [icon]="faArrowRight" class="arrow"></fa-icon>
        </a>

        <a [href]="userData.linkedin" target="_blank" class="contact-card" title="LinkedIn">
            <div class="card-icon linkedin-icon">
                <fa-icon [icon]="faLinkedin"></fa-icon>
            </div>
            <div class="card-info">
                <span class="card-label">LinkedIn</span>
                <span class="card-value">vijay-amarnath-m-v</span>
            </div>
            <fa-icon [icon]="faArrowRight" class="arrow"></fa-icon>
        </a>

        <a [href]="userData.github" target="_blank" class="contact-card" title="GitHub">
            <div class="card-icon github-icon">
                <fa-icon [icon]="faGithub"></fa-icon>
            </div>
            <div class="card-info">
                <span class="card-label">GitHub</span>
                <span class="card-value">vijayamarnath02</span>
            </div>
            <fa-icon [icon]="faArrowRight" class="arrow"></fa-icon>
        </a>

        <a [href]="'https://wa.me/' + userData.phone" target="_blank" class="contact-card" title="WhatsApp">
            <div class="card-icon whatsapp-icon">
                <fa-icon [icon]="faWhatsapp"></fa-icon>
            </div>
            <div class="card-info">
                <span class="card-label">WhatsApp</span>
                <span class="card-value">{{userData.phone}}</span>
            </div>
            <fa-icon [icon]="faArrowRight" class="arrow"></fa-icon>
        </a>

        <div class="contact-card no-link location-card">
            <div class="card-icon location-icon">
                <fa-icon [icon]="faLocationDot"></fa-icon>
            </div>
            <div class="card-info">
                <span class="card-label">Location</span>
                <span class="card-value">{{userData.address}}</span>
            </div>
        </div>

    </div>
</div>
