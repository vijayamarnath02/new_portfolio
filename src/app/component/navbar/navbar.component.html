<nav>
    <div class="content">
        <button class="brand" type="button" (click)="navigateTo('home')">
            <span class="brand-mark">VA</span>
            <span class="brand-copy">
                <strong>Vijay Amarnath</strong>
                <small>Full Stack Developer | MEAN & MERN</small>
            </span>
        </button>

        <div class="nav-shell" [class.show]="mobileMenuOpen">
            <button
                class="nav-link"
                type="button"
                *ngFor="let item of navItems"
                [class.active]="activeSection === item.id"
                (click)="navigateTo(item.id)">
                {{ item.label }}
            </button>
        </div>

        <div class="nav-actions">
            <button
                class="theme-toggle"
                type="button"
                aria-label="Toggle theme"
                (click)="toggleTheme()"
                [ngClass]="{ 'rotate-positive': animate === 'positive', 'rotate-negative': animate === 'negative' }">
                <fa-icon [icon]="isDarkMode ? faMoon : faSun"></fa-icon>
            </button>

            <button class="contact-cta" type="button" (click)="navigateTo('contact')">
                Let's Talk
            </button>

            <button
                class="hamburger"
                type="button"
                aria-label="Toggle menu"
                (click)="toggleMobileMenu()">
                <fa-icon [icon]="mobileMenuOpen ? faXmark : faBars"></fa-icon>
            </button>
        </div>
    </div>
</nav>
